<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#e4d4b8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <title>SamOS Hub</title>
</head>

<body>
    <main class="home">
        <section class="orientation">
            <div id="date">Loading...</div>
            <div id="time">
                <span id="time-numbers"></span>
                <span id="time-period"></span>
            </div>

            <div class="weather">
            <div id="weather-current">Loading weather...</div>
            <div id="weather-range"></div>
            </div>

            <blockquote>
            “You will be warm again. This is a test.”
            </blockquote>
        </section>

        <section class="media-area">

            <div id="spotify-login-message" hidden>
                Spotify connection expired. Please reconnect.
            </div>

            <button id="spotify-login">
                Connect Spotify
            </button>

            <div id="spotify-player" class="mini-player" hidden>

                <div class="playlist-picker">

                    <button id="playlist-button" class="playlist-button">
                            Choose a playlist...
                    </button>

                    <div id="playlist-menu" class="playlist-menu" hidden></div>
                    
                </div>

                <div class="album-container">

                    <img
                    id="album-art"
                    src=""
                    alt="Album art"
                    hidden
                    >

                    <div id="album-placeholder">

                        <div class="placeholder-icon">♫</div>

                        <div>Select a playlist<br>to hear something</div>
                        
                    </div>

                </div>

                <div class="track-info">
                    <div id="track-name">
                    Nothing playing
                    </div>

                    <div id="track-artist">
                    Spotify
                    </div>
                </div>

                <div class="player-controls">

                    <button id="previous-track">
                    ⏮
                    </button>

                    <button id="play-pause">
                    ▶
                    </button>

                    <button id="next-track">
                    ⏭
                    </button>

                </div>

                <div id="spotify-status">
                    SamOS Hub connected
                </div>

            </div>

        </section>
    </main>

    <script src="script.js"></script>  
</body>

</html>
