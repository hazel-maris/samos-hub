<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, viewport-fit:cover"
    >
    <title>SamOS Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e4d4b8">
</head>

<body>

<main class="home">
    <section class="orientation">
        <div id="time">--:--</div>
        <div id="date">Loading...</div>

        <div class="weather">
        <div id="weather-current">Loading weather...</div>
        <div id="weather-range"></div>
        </div>

        <blockquote>
        “You will be warm again. This is a test.”
        </blockquote>
    </section>

    <section class="media-area">

        <button id="spotify-login">
        Connect Spotify
        </button>

        <div id="spotify-player" class="mini-player" hidden>

        <div class="playlist-picker">
        <button id="playlist-button" class="playlist-button">
            Choose a playlist...
        </button>

        <div id="playlist-menu" class="playlist-menu" hidden>
        </div>
        </div>

        <div class="album-container">

            <img
            id="album-art"
            src=""
            alt="Album art"
            hidden
            >

            <div id="album-placeholder">
            <div class="placeholder-icon">♫</div>
            <div>Select a playlist<br>to hear something</div>
            </div>

        </div>

        <div class="track-info">
            <div id="track-name">
            Nothing playing
            </div>

            <div id="track-artist">
            Spotify
            </div>
        </div>

        <div class="player-controls">

            <button id="previous-track">
            ⏮
            </button>

            <button id="play-pause">
            ▶
            </button>

            <button id="next-track">
            ⏭
            </button>

        </div>

        <div id="spotify-status">
            SamOS Hub connected
        </div>

        </div>
    </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
