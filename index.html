<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4d4b8">
  <title>SamOS Hub</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="home">
    <section class="journal-shell">
      <nav class="journal-tabs" aria-label="SamOS sections">
        <button class="journal-tab active" type="button">Home</button>
      </nav>

      <section class="journal">
        <section class="orientation">
          <div class="game-panel date-panel">
            <div id="date">Loading...</div>
            <div id="time">
              <span id="time-numbers"></span>
              <span id="time-period"></span>
            </div>
          </div>

          <div class="game-panel weather-panel">
            <div class="weather">
              <div class="weather-current-row">
                <div id="weather-current">Weather loading...</div>
              </div>
              <div id="weather-range"></div>
              <div class="weather-details">
                <div id="weather-afternoon" hidden></div>
                <div id="weather-overnight" hidden></div>
                <div id="weather-alerts" hidden></div>
              </div>
            </div>
          </div>
        </section>

        <section class="media-area">
          <div class="game-panel spotify-panel">
            <div class="spotify-heading-row">
              <div>
                <div class="spotify-title">Spotify</div>
                <div id="spotify-status">Connect Spotify to load your playlists</div>
              </div>
              <button id="spotify-login" class="spotify-login" type="button">Connect</button>
            </div>

            <div id="spotify-player" class="spotify-player">
              <div class="playlist-picker">
                <button id="playlist-button" class="playlist-button" type="button">
                  Choose a playlist...
                </button>
                <div id="playlist-menu" class="playlist-menu" hidden></div>
              </div>

              <div class="album-container">
                <img id="album-art" alt="Album artwork" hidden>
                <div id="album-placeholder" aria-hidden="true">♫</div>
              </div>

              <div class="track-info">
                <div id="track-name">Nothing playing</div>
                <div id="track-artist"></div>
              </div>

              <div class="player-controls">
                <button id="previous-track" type="button" aria-label="Previous track">◀◀</button>
                <button id="play-pause" type="button" aria-label="Play or pause">▶</button>
                <button id="next-track" type="button" aria-label="Next track">▶▶</button>
              </div>
            </div>
          </div>
        </section>

        <blockquote id="quote">Build for Future Sam.</blockquote>
      </section>
    </section>

    <div id=""debug-size"></div>
  </main>

  <script src="./config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
