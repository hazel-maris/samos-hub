
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4d4b8">

  <title>SamOS Hub · Quotes</title>

  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/quotes.css">
  <link rel="stylesheet" href="../styles/mobile.css">

    <!-- Load after all other stylesheets -->
  <link rel="stylesheet" href="../styles/night.css">

  <!-- Load in the head -->
  <script src="../scripts/night-mode.js"></script>

</head>

<body data-root="..">

  <main class="home">
    <section class="journal-shell">

      <div id="nav-container"></div>

      <section class="journal quotes-journal">
        <div class="game-panel quotes-panel">
          <header class="quotes-title">Quotes.exe</header>
          <div class="quote-window">
            <div id="quote-mode" class="quote-mode">Daily splash</div>
            <div class="quote-body">
              <p id="daily-quote" class="quotes-message" aria-live="polite" aria-atomic="true">Loading a little joy…</p>
              <div class="quote-actions">
                <button id="quote-next" type="button">Another little joy</button>
                <button id="quote-reset" type="button" hidden>Today's message</button>
              </div>
            </div>
            <footer class="quote-status">100 little joys · No quests required</footer>
          </div>
        </div>
      </section>

    </section>
  </main>

  <script src="../scripts/nav.js"></script>
  <script src="../scripts/quotes.js"></script>

</body>
</html>
