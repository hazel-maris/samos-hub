
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4d4b8">
  <title>SamOS Hub · Settings</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/mobile.css">
  <link rel="stylesheet" href="../styles/settings.css">
  <!-- Load after all other stylesheets -->
  <link rel="stylesheet" href="../styles/night.css">

  <!-- Load in the head -->
  <script src="../scripts/night-mode.js"></script>

</head>

<body data-root="..">
  <main class="home">
    <section class="journal-shell">
      <div id="nav-container"></div>

      <section class="journal settings-journal">
        <section class="settings-area">
          <div class="game-panel settings-panel">
            <h1 class="settings-title">Settings</h1>

            <!-- ACCOUNT -->
            <section class="settings-section">
              <h2 class="settings-section-title">Account</h2>
              <div id="supabase-auth-status" role="status" aria-live="polite">
                Not signed in
              </div>

              <div id="supabase-login-form" class="settings-login">
                <input
                  id="supabase-email"
                  type="email"
                  placeholder="Email"
                  aria-label="Email"
                  autocomplete="email"
                >
                <input
                  id="supabase-password"
                  type="password"
                  placeholder="Password"
                  aria-label="Password"
                  autocomplete="current-password"
                >
                <button id="supabase-login" type="button">Sign in</button>
              </div>

              <button id="supabase-logout" type="button" hidden>Sign out</button>
            </section>

            <!-- UPCOMING -->
            <section class="settings-section">
              <h2 class="settings-section-title">Upcoming</h2>

              <label class="settings-row">
                <span>Show daily tasks</span>
                <input id="setting-daily-tasks" type="checkbox">
              </label>

              <label class="settings-row">
                <span>Show weekly tasks</span>
                <input id="setting-weekly-tasks" type="checkbox">
              </label>

              <label class="settings-row">
                <span>Show monthly tasks</span>
                <input id="setting-monthly-tasks" type="checkbox">
              </label>

              <label class="settings-row">
                <span>Show yearly tasks</span>
                <input id="setting-yearly-tasks" type="checkbox">
              </label>
            </section>
          </div>
        </section>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../scripts/app.js"></script>
  <script src="../scripts/nav.js"></script>
  <script src="../scripts/settings.js"></script>
</body>
</html>
