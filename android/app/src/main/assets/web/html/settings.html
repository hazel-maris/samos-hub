<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#e4d4b8">

  <title>SamOS Hub · Settings</title>

  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="stylesheet" href="../styles/base.css?v=20261006-1">
  <link rel="stylesheet" href="../styles/settings.css?v=20261006-1">
  <link rel="stylesheet" href="../styles/mobile.css?v=20261006-1">
</head>

<body data-root="..">

  <main class="home">

    <section class="journal-shell">

      <div id="nav-container"></div>

      <section class="journal settings-journal">

        <section class="settings-area">

          <div class="game-panel settings-panel">

            <div class="settings-title">
              Settings
            </div>


            <div class="settings-section">

              <div class="settings-section-title">
                Weather
              </div>

              <label class="settings-row">

                <span>
                  Show sunrise and sunset
                </span>

                <input
                  id="setting-sun-times"
                  type="checkbox"
                >

              </label>

            </div>

          </div>

        </section>

      </section>

    </section>

  </main>


  <script src="../config.js"></script>

  <script src="../scripts/app.js"></script>
  <script src="../scripts/nav.js"></script>
  <script src="../scripts/settings.js"></script>
</body>

</html>
