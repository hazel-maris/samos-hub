<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4d4b8">
  <title>SamOS Hub · Triage</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/mobile.css">
  <link rel="stylesheet" href="../styles/triage.css">
  <link rel="stylesheet" href="../styles/night.css">
  <script src="../scripts/night-mode.js"></script>
</head>
<body data-root="..">
  <main class="home"><section class="journal-shell">
    <div id="nav-container"></div>
    <section class="journal triage-journal"><section class="triage-area">
      <div class="game-panel triage-panel">
        <h1>Triage</h1>
        <p class="triage-description">Get it out of your head. One task at a time.</p>
        <p id="triage-message" role="status" aria-live="polite"></p>

        <div class="triage-columns">
          <section aria-labelledby="inbox-heading" class="triage-section triage-inbox-panel">
            <div class="triage-heading">
              <h2 id="inbox-heading">Brain Dump</h2>
              <span class="triage-note">No sorting required</span>
            </div>
            <form id="triage-form" class="triage-form">
              <input id="triage-input" type="text" maxlength="1000"
                     placeholder="What's on your mind?" aria-label="New thought"
                     autocomplete="off" required>
              <button type="submit" id="triage-add">+</button>
            </form>
            <div id="triage-list" class="triage-list triage-scroll">Loading…</div>
          </section>

          <section aria-labelledby="goals-heading" class="triage-section triage-goals-panel">
            <div class="triage-heading"><h2 id="goals-heading">Goals</h2></div>
            <form id="triage-goal-form" class="triage-form">
              <input id="triage-goal-input" type="text" maxlength="240"
                     placeholder="What's the big goal?" aria-label="New goal" required>
              <button type="submit">+</button>
            </form>
            <div id="triage-goals" class="triage-goals triage-scroll">Loading goals…</div>
          </section>
        </div>
      </div>
    </section></section>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../scripts/app.js"></script>
  <script src="../scripts/nav.js"></script>
  <script src="../scripts/triage.js"></script>
</body>
</html>
