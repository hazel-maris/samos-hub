<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <meta content="#e4d4b8" name="theme-color"/>
  <title>
   SamOS Hub &middot; Upcoming
  </title>
  <link href="../manifest.webmanifest" rel="manifest"/>
  <link href="../styles/base.css" rel="stylesheet"/>
  <link href="../styles/upcoming.css" rel="stylesheet"/>
  <link href="../styles/mobile.css" rel="stylesheet"/>
  <style>
   #upcoming-add-panel[hidden] { display: none !important; }
  </style>
 </head>
 <body data-root="..">
  <main class="home">
   <!-- =====================================================
         DELETE CONFIRMATION
         ===================================================== -->
   <div class="delete-confirm-overlay" hidden="" id="delete-confirm-overlay">
    <div class="delete-confirm-box">
     <div class="delete-confirm-title">
      Delete item?
     </div>
     <div class="delete-confirm-name" id="delete-confirm-name">
     </div>
     <div class="delete-confirm-actions">
      <button id="delete-cancel" type="button">
       Cancel
      </button>
      <button id="delete-confirm" type="button">
       Delete
      </button>
     </div>
    </div>
   </div>
   <!-- =====================================================
     TIME PICKER
     ===================================================== -->
   <div class="time-overlay" hidden="" id="time-overlay">
    <div aria-label="Choose time" aria-modal="true" class="time-box" role="dialog">
     <div class="time-picker-title">
      Choose Time
     </div>
     <div class="time-picker-mode">
      <button class="time-mode-button active" id="time-mode-hour" type="button">
       Hour
      </button>
      <button class="time-mode-button" id="time-mode-minute" type="button">
       Minute
      </button>
     </div>
     <div class="time-clock-face" id="time-clock-face">
     </div>
     <div class="time-minute-adjust" hidden="" id="time-minute-adjust">
      <button aria-label="Previous minute" id="time-minute-minus" type="button">
       &minus;
      </button>
      <div class="time-exact-minute" id="time-exact-minute">
       00
      </div>
      <button aria-label="Next minute" id="time-minute-plus" type="button">
       +
      </button>
     </div>
     <div class="time-period-row">
      <button class="time-period-button" id="time-am" type="button">
       AM
      </button>
      <button class="time-period-button" id="time-pm" type="button">
       PM
      </button>
     </div>
     <div class="time-preview" id="time-preview">
      12:00 PM
     </div>
     <div class="time-picker-actions">
      <button id="time-cancel" type="button">
       Cancel
      </button>
      <button id="time-done" type="button">
       Done
      </button>
     </div>
    </div>
   </div>
   <!-- =====================================================
         CALENDAR PICKER
         ===================================================== -->
   <div class="calendar-overlay" hidden="" id="calendar-overlay">
    <div aria-label="Choose date" aria-modal="true" class="calendar-box" role="dialog">
     <div class="calendar-top-row">
      <button aria-label="Previous month" class="calendar-nav-button" id="calendar-prev" type="button">
       &lt;
      </button>
      <div class="calendar-heading" id="calendar-heading">
       October 2026
      </div>
      <button aria-label="Next month" class="calendar-nav-button" id="calendar-next" type="button">
       &gt;
      </button>
     </div>
     <div class="calendar-controls">
      <label>
       <span>
        Month
       </span>
       <select id="calendar-month">
       </select>
      </label>
      <label>
       <span>
        Year
       </span>
       <input id="calendar-year" type="text" inputmode="numeric" maxlength="4" placeholder="2026" aria-label="Calendar year (YY or YYYY)" autocomplete="off">
      </label>
      <button id="calendar-today" type="button">
       Today
      </button>
     </div>
     <div class="calendar-weekdays">
      <span>
       Sun
      </span>
      <span>
       Mon
      </span>
      <span>
       Tue
      </span>
      <span>
       Wed
      </span>
      <span>
       Thu
      </span>
      <span>
       Fri
      </span>
      <span>
       Sat
      </span>
     </div>
     <div class="calendar-grid" id="calendar-grid">
     </div>
     <div class="calendar-bottom-row">
      <button id="calendar-cancel" type="button">
       Cancel
      </button>
     </div>
    </div>
   </div>
   <!-- =====================================================
         MAIN JOURNAL
         ===================================================== -->
   <section class="journal-shell">
    <div id="nav-container">
    </div>
    <section class="journal upcoming-journal">
     <section class="upcoming-area">
      <div class="game-panel upcoming-page-panel">
       <div class="upcoming-top-row">
        <h1 class="upcoming-page-title">UPCOMING</h1>
        <button class="upcoming-add-toggle" id="upcoming-add-toggle" type="button" aria-label="Add Item" title="Add Item" aria-controls="upcoming-add-panel" aria-expanded="false">
         <span class="upcoming-add-plus" aria-hidden="true">+</span>
        </button>
       </div>
       <section class="upcoming-add-section" id="upcoming-add-details">
        <div class="upcoming-form" id="upcoming-add-panel" hidden>
         <!-- TITLE -->
         <label class="upcoming-field">
          <span>
           Title
          </span>
          <input autocomplete="off" id="upcoming-title" placeholder="What&rsquo;s coming up?" type="text"/>
         </label>
         <!-- DATE -->
         <label class="upcoming-field">
          <span>
           Date
          </span>
          <div class="date-input-wrap">
           <input autocomplete="off" id="upcoming-date" inputmode="text" maxlength="10" placeholder="MM/DD/YYYY" type="text"/>
           <button aria-label="Open calendar" class="date-picker-button" data-date-target="upcoming-date" title="Open calendar" type="button">
            ▦
           </button>
          </div>
         </label>
         <!-- TIME -->
         <label class="upcoming-field">
          <span>
           Time
          </span>
          <div class="time-input-wrap">
           <input autocomplete="off" id="upcoming-time" inputmode="text" placeholder="3:30 PM" type="text"/>
           <button aria-label="Open time picker" class="time-picker-button" data-time-target="upcoming-time" title="Open time picker" type="button">
            ◷
           </button>
          </div>
         </label>
         <!-- OPTIONAL LOCATION -->
         <label class="upcoming-field">
          <span>Location (optional)</span>
          <input autocomplete="off" id="upcoming-location" placeholder="Address, town, suite #, anything" type="text"/>
         </label>
         <!-- REPEATS -->
         <label class="upcoming-field">
          <span>
           Repeats
          </span>
          <select id="upcoming-recurrence">
           <option value="">
            Does not repeat
           </option>
           <option value="daily">
            Daily
           </option>
           <option value="weekly">
            Weekly
           </option>
           <option value="monthly">
            Monthly
           </option>
           <option value="yearly">
            Yearly
           </option>
          </select>
         </label>
         <!-- ADD -->
         <button id="upcoming-add" type="button">
          Add
         </button>
         <div class="upcoming-form-status" id="upcoming-form-status">
         </div>
        </div>
       </section>
       <!-- =================================================
                 UPCOMING ITEMS
                 ================================================= -->
       <div id="upcoming-list">
        Loading...
       </div>
      </div>
     </section>
    </section>
   </section>
  </main>
  <!-- =========================================================
       SCRIPTS
       ========================================================= -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <script src="../config.js">
  </script>
  <script src="../scripts/app.js">
  </script>
  <script src="../scripts/nav.js">
  </script>
  <script src="../scripts/upcoming.js">
  </script>
  <script src="../scripts/upcoming-android.js">
  </script>
  <script>
   // Use an explicit button instead of relying on native <details> toggling.
   (() => {
     const toggle = document.getElementById("upcoming-add-toggle");
     const panel = document.getElementById("upcoming-add-panel");
     const status = document.getElementById("upcoming-form-status");
     if (!toggle || !panel || !status) return;

     function setAddPanelOpen(open) {
       panel.hidden = !open;
       toggle.setAttribute("aria-expanded", String(open));
     }

     toggle.addEventListener("click", () => {
       setAddPanelOpen(panel.hidden);
     });

     // Return to the task list after an item is successfully added.
     new MutationObserver(() => {
       if (status.textContent.trim() === "Added!") {
         setAddPanelOpen(false);
       }
     }).observe(status, {
       childList: true,
       characterData: true,
       subtree: true
     });
   })();
  </script>
 </body>
</html>
