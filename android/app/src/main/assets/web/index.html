<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#e4d4b8"
  >

  <title>SamOS Hub</title>

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="./styles/base.css"
  >

  <link
    rel="stylesheet"
    href="./styles/home.css"
  >

  <link
    rel="stylesheet"
    href="./styles/mobile.css"
  >
</head>


<body data-root=".">

  <main class="home">

    <section class="journal-shell">

      <div id="nav-container"></div>


      <section class="journal">


        <!-- =====================================================
             LEFT COLUMN
             ===================================================== -->

        <section class="orientation">


          <!-- ===================================================
               DATE / TIME
               =================================================== -->

          <div class="game-panel date-panel">

            <div id="date">
              Loading...
            </div>


            <div id="time">

              <span id="time-numbers"></span>

              <span id="time-period"></span>

            </div>

          </div>


          <!-- ===================================================
               WEATHER
               =================================================== -->

          <div class="game-panel weather-panel">

            <div class="weather">


              <!-- LEFT: CURRENT WEATHER -->

              <section class="weather-forecast-side">
                <div class ="weather-current-heading">
                  CURRENT WEATHER
                </div>
                      
                <div class="weather-current-row">

                  <div id="weather-current">            

                    <div class="weather-temp-row">

                      <img
                        id="temp-icon"
                        src=""
                        alt=""
                        hidden
                      >

                      <span id="weather-temp">
                        --
                      </span>

                    </div>


                    <div class="weather-condition-row">

                      <img
                        id="weather-icon"
                        src=""
                        alt=""
                        hidden
                      >

                      <span id="weather-condition">
                        Weather loading...
                      </span>

                    </div>

                  </div>

                </div>


                <!-- HIGH / LOW -->

                <div id="weather-range">
                  High --° · Low --°
                </div>


                <!-- SUNRISE / SUNSET -->

                <div id="sun-times">
                  Sunrise -- · Sunset --
                </div>

              </section>


              <!-- =================================================
                   RIGHT: OUTLOOK + ALERTS
                   ================================================= -->

              <section class="weather-alert-side">

                <!-- OUTLOOK -->

                <div class="weather-upcoming">

                  <div class="weather-alert-heading">
                    OUTLOOK
                  </div>


                  <!-- AFTERNOON WEATHER -->

                  <div
                    id="weather-afternoon"
                    class="forecast-line"
                    hidden
                  >

                    <img
                      class="weather-forecast-icon"
                      src="./icons/afternoon-icon.png"
                      alt=""
                    >

                    <span
                      id="weather-afternoon-text"
                    ></span>

                  </div>


                  <!-- OVERNIGHT WEATHER -->

                  <div
                    id="weather-overnight"
                    class="forecast-line"
                    hidden
                  >

                    <img
                      class="weather-forecast-icon"
                      src="./icons/overnight-icon.png"
                      alt=""
                    >

                    <span
                      id="weather-overnight-text"
                    ></span>

                  </div>


                  <!-- MAJOR UPCOMING WEATHER -->

                  <div id="weather-event">

                    <img
                      id="weather-event-icon"
                      src="./icons/weather-major-event.png"
                      alt=""
                      hidden
                    >

                    <span
                      id="weather-event-text"
                      class="no-weather-events"
                    >
                      No forecasted events or storms.
                    </span>

                  </div>

                </div>


                <!-- DIVIDER -->

                <div
                  class="weather-alert-divider"
                ></div>


                <!-- OFFICIAL ALERTS -->

                <div class="weather-alert-heading">
                  ALERTS
                </div>


                <div id="weather-alerts">

                  <div class="no-weather-alerts">
                    No watches, warnings, or advisories.
                  </div>

                </div>

              </section>

            </div>

          </div>


          <!-- ===================================================
               UPCOMING DATES
               =================================================== -->

          <div class="game-panel upcoming-panel">

            <div class="upcoming-title">
              THIS WEEK
            </div>

            <div
              id="home-upcoming-list"
              class="upcoming-dates"
            >
              Loading...
            </div>

            <a
              class="upcoming-see-all"
              href="./html/upcoming.html"
            >
              See all
            </a>

          </div>

        </section>


        <!-- =====================================================
             MUSIC
             ===================================================== -->

        <section class="media-area">

          <div class="game-panel spotify-panel">


            <!-- =================================================
                 SPOTIFY HEADER
                 ================================================= -->

            <div class="spotify-heading-row">

              <div class="spotify-heading-copy">

                <div class="spotify-title">
                  SPOTIFY
                </div>

                <div id="spotify-status">
                  Connect Spotify to load your playlists
                </div>

              </div>


              <button
                id="spotify-login"
                class="spotify-login"
                type="button"
              >
                Connect
              </button>

            </div>


            <!-- =================================================
                 PLAYER
                 ================================================= -->

            <div
              id="spotify-player"
              class="mini-player"
            >


              <!-- PLAYLIST PICKER -->

              <div class="playlist-picker">

                <button
                  id="playlist-button"
                  class="playlist-button"
                  type="button"
                >
                  Choose a playlist...
                </button>


                <div
                  id="playlist-menu"
                  class="playlist-menu"
                  hidden
                ></div>

              </div>


              <!-- ALBUM ART -->

              <div class="album-container">

                <img
                  id="album-art"
                  src=""
                  alt="Album artwork"
                  hidden
                >


                <div
                  id="album-placeholder"
                  aria-hidden="true"
                >

                  <div class="placeholder-icon">
                    ♫
                  </div>

                </div>

              </div>


              <!-- TRACK INFO -->

              <div class="track-info">

                <div id="track-name">
                  Nothing playing
                </div>

                <div id="track-artist"></div>

              </div>


              <!-- PLAYER CONTROLS -->

              <div class="player-controls">


                <!-- PREVIOUS -->

                <button
                  id="previous-track"
                  type="button"
                  aria-label="Previous track"
                >

                  <img
                    src="./icons/player-previous.png"
                    alt=""
                  >

                </button>


                <!-- PLAY / PAUSE -->

                <button
                  id="play-pause"
                  type="button"
                  aria-label="Play or pause"
                >

                  <img
                    id="play-pause-icon"
                    src="./icons/player-play.png"
                    alt=""
                  >

                </button>


                <!-- NEXT -->

                <button
                  id="next-track"
                  type="button"
                  aria-label="Next track"
                >

                  <img
                    src="./icons/player-next.png"
                    alt=""
                  >

                </button>

              </div>

            </div>

          </div>

        </section>


        <!-- =====================================================
             QUOTE
             ===================================================== -->

        <blockquote id="quote">
          Build for Future Sam.
        </blockquote>


      </section>

    </section>

  </main>


  <!-- =========================================================
       SCRIPTS
       ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./config.js"></script>

  <script src="./scripts/app.js"></script>
  <script src="./scripts/nav.js"></script>
  <script src="./scripts/weather.js"></script>
  <script src="./scripts/spotify.js"></script>
  <script src="./scripts/android.js"></script>
  <script src="./scripts/home-upcoming.js"></script>
  <script src="./scripts/home.js"></script>

</body>

</html>
